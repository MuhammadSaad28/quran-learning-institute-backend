[build]
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["mongoose"]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Scheduled function for class reminders (every 15 minutes)
[functions."send-reminders"]
  schedule = "*/15 * * * *"

# Scheduled function for weekly schedule generation (every Sunday at midnight)
[functions."generate-schedules"]
  schedule = "0 0 * * 0"
